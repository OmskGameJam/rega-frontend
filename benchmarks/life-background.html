<!doctype html><meta charset="utf-8"><pre id="result">Running</pre><script>window.onerror = (message, url, line) => { document.getElementById('result').textContent = message + ' at ' + line; };</script><script>
let context, background, columns, rows, cells;
const canvasRef = {value: document.createElement('canvas')};
document.body.append(canvasRef.value);
const LIFE = 1, SAND = 2, emitterSlots = [];
const CELL_SIZE = 6;
const HEIGHT = 512;
const BACKGROUND_ROWS = Math.ceil(HEIGHT / CELL_SIZE);
const BACKGROUND_LEVELS = 5;
const BACKGROUND_COLORS = Array.from({ length: BACKGROUND_LEVELS }, (_, level) => {
    const blue = Math.round(0x44 * (1 - level / (BACKGROUND_LEVELS - 1)));
    return `#0000${blue.toString(16).padStart(2, '0')}77`;
});
const BAYER_4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function createBackground(width) {
    const layer = document.createElement('canvas');
    layer.width = width;
    layer.height = HEIGHT;
    const layerContext = layer.getContext('2d');
    if (!layerContext)
        return null;
    for (let y = 0; y < BACKGROUND_ROWS; y++) {
        const level = y / (BACKGROUND_ROWS - 1) * (BACKGROUND_LEVELS - 1);
        const lower = Math.floor(level);
        // Leave solid bands around a dithered transition spanning 40% of each interval.
        const blend = Math.max(0, Math.min(1, (level - lower - 0.3) / 0.4));
        for (let x = 0; x < Math.ceil(width / CELL_SIZE); x++) {
            const threshold = (BAYER_4[(y % 4) * 4 + x % 4] + 0.5) / 16;
            const color = Math.min(BACKGROUND_LEVELS - 1, lower + Number(blend > threshold));
            layerContext.fillStyle = BACKGROUND_COLORS[color];
            layerContext.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
        }
    }
    return layer;
}
function draw() {
    if (!context || !canvasRef.value)
        return;
    // Cache the cell-aligned pattern while retaining the translucent trail fade.
    if (background)
        context.drawImage(background, 0, 0);
    // Batch adjacent cells while keeping canvas style changes outside the hot loop.
    for (let material = LIFE; material <= SAND; material++) {
        context.fillStyle = material === LIFE ? '#fff' : '#e6bd38';
        for (let y = 0; y < rows; y++) {
            const row = y * columns;
            let x = 0;
            while (x < columns) {
                if (cells[row + x] !== material) {
                    x++;
                    continue;
                }
                const start = x++;
                while (x < columns && cells[row + x] === material)
                    x++;
                context.fillRect(start * CELL_SIZE, y * CELL_SIZE, (x - start) * CELL_SIZE, CELL_SIZE);
            }
        }
    }
    for (const slot of emitterSlots) {
        if (slot.emitter)
            context.fillRect(Math.round(slot.emitter.x), 0, 1, 1);
    }
}

const flat = () => { context.fillStyle = '#00004477'; context.fillRect(0, 0, canvasRef.value.width, HEIGHT); };
const rowGradient = () => {
  for (let y = 0; y < BACKGROUND_ROWS; y++) {
    const blue = Math.round(68 * (1 - y / (BACKGROUND_ROWS - 1)));
    context.fillStyle = '#0000' + blue.toString(16).padStart(2, '0') + '77';
    context.fillRect(0, y * CELL_SIZE, canvasRef.value.width, Math.min(CELL_SIZE, HEIGHT - y * CELL_SIZE));
  }
};
const uncached = () => {
  for (let y = 0; y < BACKGROUND_ROWS; y++) {
    const level = y / (BACKGROUND_ROWS - 1) * (BACKGROUND_LEVELS - 1);
    const lower = Math.floor(level);
    const blend = Math.max(0, Math.min(1, (level - lower - .3) / .4));
    for (let x = 0; x < Math.ceil(canvasRef.value.width / CELL_SIZE); x++) {
      const threshold = (BAYER_4[(y % 4) * 4 + x % 4] + .5) / 16;
      context.fillStyle = BACKGROUND_COLORS[Math.min(BACKGROUND_LEVELS - 1, lower + Number(blend > threshold))];
      context.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
    }
  }
};
const cached = () => context.drawImage(background, 0, 0);
const materialSource = "function materials() {\n    if (!context || !canvasRef.value)\n        return;\n    // Cache the cell-aligned pattern while retaining the translucent trail fade.\n    if (background)\n        context.drawImage(background, 0, 0);\n    // Batch adjacent cells while keeping canvas style changes outside the hot loop.\n    for (let material = LIFE; material <= SAND; material++) {\n        context.fillStyle = material === LIFE ? '#fff' : '#e6bd38';\n        for (let y = 0; y < rows; y++) {\n            const row = y * columns;\n            let x = 0;\n            while (x < columns) {\n                if (cells[row + x] !== material) {\n                    x++;\n                    continue;\n                }\n                const start = x++;\n                while (x < columns && cells[row + x] === material)\n                    x++;\n                context.fillRect(start * CELL_SIZE, y * CELL_SIZE, (x - start) * CELL_SIZE, CELL_SIZE);\n            }\n        }\n    }\n    for (const slot of emitterSlots) {\n        if (slot.emitter)\n            context.fillRect(Math.round(slot.emitter.x), 0, 1, 1);\n    }\n}\n";
eval(materialSource);
const isolatedVariant = new URLSearchParams(location.search).get('variant');
const variants = isolatedVariant === 'flat' ? {flat} : isolatedVariant === 'cached' ? {cached} : {flat, rowGradient, uncached, cached};
const results = [];
const median = values => [...values].sort((a,b) => a-b)[Math.floor(values.length/2)];
// A readback once per batch flushes deferred canvas work; its fixed overhead is amortized.
function batch(fn, count = 30) {
  const start = performance.now();
  for (let i = 0; i < count; i++) fn();
  context.getImageData(0, 0, 1, 1);
  return (performance.now() - start) / count;
}
for (const width of [360, 960, 1920]) {
  canvasRef.value.width = width; canvasRef.value.height = HEIGHT;
  context = canvasRef.value.getContext('2d');
  columns = Math.floor(width / CELL_SIZE); rows = Math.floor(HEIGHT / CELL_SIZE);
  cells = new Uint8Array(columns * rows);
  let seed = 12345;
  for (let i = 0; i < cells.length; i++) {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    const chance = seed / 4294967296;
    cells[i] = chance < .12 ? LIFE : chance < .15 ? SAND : 0;
  }
  const buildSamples = [];
  for (let i = 0; i < (isolatedVariant === 'flat' ? 0 : 9); i++) {
    const start = performance.now(); background = createBackground(width);
    background.getContext('2d').getImageData(0, 0, 1, 1);
    buildSamples.push(performance.now() - start);
  }
  for (const full of [false, true]) {
    const samples = Object.fromEntries(Object.keys(variants).map(key => [key, []]));
    const functions = Object.fromEntries(Object.entries(variants).map(([key, fn]) => [key, () => { fn(); if (full) materials(); }]));
    for (const fn of Object.values(functions)) batch(fn);
    for (let round = 0; round < 9; round++) {
      const keys = Object.keys(variants);
      for (let offset = 0; offset < keys.length; offset++) {
        const key = keys[(round + offset) % keys.length];
        samples[key].push(batch(functions[key]));
      }
    }
    results.push({width, mode: full ? 'full draw, 15% occupied' : 'background only', medianMs: Object.fromEntries(Object.entries(samples).map(([key, values]) => [key, median(values)])), samplesMs: samples, rebuildMedianMs: buildSamples.length ? median(buildSamples) : null});
  }
}
document.getElementById('result').textContent = JSON.stringify({userAgent:navigator.userAgent, batchSize:30, rounds:9, results}, null, 2);
</script>
